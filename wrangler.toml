# UptimePulse - Cloudflare Workers 部署配置（完整版）
name = "uptime-pulse"
main = "workers.js"
compatibility_date = "2026-11-20"

# KV：先执行 `wrangler kv namespace create UPTIME_KV`，把 id 填入下方
[[kv_namespaces]]
binding = "KV"
id = "3fecb5a52a024f3da729b4f1a9867036"

# 每分钟调度一次；实际检测间隔由每个监控项的 intervalSec 控制
[triggers]
crons = ["* * * * *"]

# 监控项在 workers.js 顶部的 MONITORS 数组中集中维护；改完重新部署即生效。
#
# 告警地址与开关请在 Dashboard → Worker → Variables and Secrets 中以普通变量（plain_text）添加，不要选 Secret（用户要求变量值不加密）：
#   ALERT_WEBHOOK_ENABLED  Webhook 开关：true/false（未设置时，填了地址即开启）
#   ALERT_WEBHOOK_URL      Webhook 通知地址（兼容旧变量 WEBHOOK_URL）；Server酱 .send 会自动提取 text/desp 预设文案并作为 body 的 title/desp 发送
#   ALERT_FAILURE_THRESHOLD  失败阈值：设 1 = 检测到宕机/无法联通立即推送（推荐）；未设置则沿用监控项默认值
#   ALERT_EMAIL_ENABLED    邮件开关：true/false（未设置时，邮件传输就绪即开启）
#   ALERT_EMAIL_TO         邮件收件人（兼容旧变量 EMAIL_TO）
#   RESEND_API_KEY / EMAIL_FROM  邮件传输凭据与发件人
#   ALERT_SIGNING_SECRET   Webhook HMAC 签名密钥
#   PROBE_TOKEN            探针回传令牌（仅 /api/ingest 与探针任务使用）
#   PROBE_REGION           本实例线路标识，例如 cf-sin / cf-fra
# 只读版已移除 ADMIN_TOKEN 与所有配置写接口；写操作一律返回 405。
# 注意：wrangler deploy 必须带 --keep-vars，否则会清空 Dashboard 变量。
